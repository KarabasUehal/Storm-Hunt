admin: # Настройка административного интерфейса Envoy
  access_log_path: /tmp/admin_access.log # Путь, куда записываются логи доступа к админке
  address:
    socket_address:
      address: 0.0.0.0 # Прокси слушает запросы к админке на всех интерфейсах
      port_value: 9901 # Порт доступа к админке для просмотра статистики, конфигурации или логов Envoy

static_resources: # Определяет основные ресурсы Envoy: listeners (где принимает запросы) и clusters (куда перенаправляет запросы)
  listeners:
    # Единый listener для HTTP/REST, gRPC-Web и Keycloak
    - name: main_listener # Имя слушателя
      address:
        socket_address:
          address: 0.0.0.0 # Прокси слушает запросы на всех интерфейсах
          port_value: 8080 # Все запросы с фронтенда приходят на этот порт
      filter_chains: # Цепочка фильтров для обработки входящих запросов
        - filters: 
            - name: envoy.filters.network.http_connection_manager # Используется фильтр, управляющий HTTP-запросами
              typed_config: # Указывает тип конфигурации фильтра  
                "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
                stat_prefix: ingress_http # Префикс для метрик (Для просмотра статистики из админки)
                codec_type: AUTO #Автоматически определяет протокол в зависимости от запроса. Для поддержки gRPC (HTTP/2) и gRPC-Web (HTTP/1.1)
                common_http_protocol_options:
                  idle_timeout: 0s # Отключение таймаута простоя соединений, чтобы поддерживать долгоживущие gRPC-соединения
                route_config: 
                  name: local_route # Имя конфигурации маршрутов
                  virtual_hosts: # Определение виртуальных хостов (группы маршрутов)
                    - name: services # Имя виртуального хоста
                      domains: ["*"] # Принимает запросы с любым доменом (выбрано в условиях разработки)
                      routes:
                        # Маршрут для Keycloak (OIDC, UI)
                        - match:
                            prefix: "/realms/" # Перенаправляет запросы, начинающиеся с /realms/ на кластер Keycloak
                          route:
                            cluster: keycloak_cluster
                            timeout: 60s # Максимальное время ожидания ответа
                        # Маршруты для backend REST API
                        - match:
                            prefix: "/v1/storm/updates" # Перенаправляет запросы /v1/storm/updates на кластер REST (storm-backend:8082)
                          route:
                            cluster: backend_rest_cluster
                            timeout: 60s
                        - match:
                            prefix: "/v1/storm/webcams" # Перенаправляет запросы /v1/storm/webcams на кластер REST (storm-backend:8082)
                          route:
                            cluster: backend_rest_cluster
                            timeout: 60s
                        - match:
                            prefix: "/send-webcams-task"
                          route:
                            cluster: backend_rest_cluster
                            timeout: 60s
                        - match:
                            prefix: "/storms"
                          route:
                            cluster: backend_rest_cluster
                            timeout: 60s
                        # Маршрут для gRPC-Web (включая путь StormService)
                        - match:
                            prefix: "/stormhunter.StormService/" # Перенаправляет запросы, начинающиеся с /stormhunter.StormService/ на кластер gRPC (storm-backend:50051)
                          route:
                            cluster: backend_grpc_cluster
                            max_stream_duration:
                              max_stream_duration: 0s # Отключает ограничение на длительность gRPC-потока (для стриминга)
                        # Catch-all для других gRPC-Web запросов, не попавших под предыдущие маршруты
                            prefix: "/" # Любой путь, не соответствующий /realms/, /v1/storm/updates, или /stormhunter.StormService/
                            grpc: {} # Указание, что это gRPC-запросы
                          route:
                            cluster: backend_grpc_cluster # Перенаправление к gRPC-бэкенду
                            max_stream_duration:
                              max_stream_duration: 0s # Неограниченная длительность потока
                              
                      cors: # Настройка CORS (Cross-Origin Resource Sharing) для запросов от фронтенда
                        allow_origin_string_match:
                          - safe_regex:
                              google_re2: {}
                              regex: "^http://localhost:3000$" # Разрешает запросы только с этого url
                        allow_methods: "GET, POST, OPTIONS" # Разрешённые HTTP-методы (OPTIONS для preflight-запросов)
                        allow_headers: "Authorization, Content-Type, x-grpc-web, X-Grpc-Web, x-user-agent, X-User-Agent, grpc-timeout, x-requested-with, connect-protocol-version" # Разрешённые заголовки
                        expose_headers: "grpc-status, grpc-message, Grpc-Status, Grpc-Message, Grpc-Encoding, Grpc-Accept-Encoding" # Заголовки, которые фронтенд может видеть в ответах
                        max_age: "1728000" # Кэширование CORS-настроек на 20 дней
                        allow_credentials: true  # Разрешает отправку cookies и заголовков авторизации (нужно для Keycloak)

                http_filters: # Определяет фильтры для обработки HTTP-запросов
                  - name: envoy.filters.http.grpc_web # Конвертирует gRPC-Web (HTTP/1.1) в gRPC (HTTP/2), позволяя фронтенду общаться с gRPC-бэкендом
                    typed_config:
                      "@type": "type.googleapis.com/envoy.extensions.filters.http.grpc_web.v3.GrpcWeb"
                  - name: envoy.filters.http.cors # Применяет CORS-настройки (из секции CORS выше)
                    typed_config:
                      "@type": "type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors"
                  - name: envoy.filters.http.router # Выполняет маршрутизацию запросов к нужным кластерам
                    typed_config:
                      "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
                common_http_protocol_options:
                  idle_timeout: 0s # Отключает таймаут простоя для всех фильтров

  clusters:
    # Cluster для Keycloak
    - name: keycloak_cluster
      connect_timeout: 10s # Таймаут соединения
      type: LOGICAL_DNS # Использует DNS для разрешения адреса keycloak
      lb_policy: ROUND_ROBIN # Балансировка нагрузки, если сервисов Keycloak несколько
      load_assignment:
        cluster_name: keycloak_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: keycloak
                      port_value: 8080 # Внутри сети docker-compose

    # Cluster для backend REST API
    - name: backend_rest_cluster
      connect_timeout: 10s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend_rest_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: storm-backend
                      port_value: 8082

    # Cluster для backend gRPC
    - name: backend_grpc_cluster
      connect_timeout: 10s
      type: LOGICAL_DNS
      common_http_protocol_options:
        idle_timeout: 0s
      lb_policy: ROUND_ROBIN
      http2_protocol_options:  
        max_concurrent_streams: 1000 # Поддерживает HTTP/2 (для gRPC) и до 1000 одновременных потоков
      load_assignment:
        cluster_name: backend_grpc_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: storm-backend
                      port_value: 50051